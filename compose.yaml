services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=chickenpix'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5433:5432'

  backend:
      build:
        context: .
        dockerfile: Dockerfile
      container_name: chikenpix_back
      ports:
        - '8080:8080'
      environment:
        - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/chickenpix
        - SPRING_DATASOURCE_USERNAME=myuser
        - SPRING_DATASOURCE_PASSWORD=secret
      depends_on:
          - postgres

volumes:
  postgres_data:
