name: Commit Lint

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  commitlint:
    name: Verificar padrão dos commits
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # necessário para acessar o histórico de commits

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar commitlint
        run: npm install --no-save @commitlint/cli @commitlint/config-conventional

      - name: Validar commits do PR
        run: >
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose